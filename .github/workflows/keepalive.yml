name: Keep Supabase Awake

# Supabase free-tier projects pause after ~7 days with no database activity, and
# a long-paused project can be torn down. That is what wiped the app after two
# weeks of not using it. A tiny daily query counts as activity and prevents the
# pause entirely — this is the fix for the cause, not the symptom.

on:
  schedule:
    - cron: '0 12 * * *'   # noon UTC, deliberately far from the 6 AM backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            exit 1
          fi
          # psql 16 (preinstalled) is fine here — a SELECT has no version constraint
          recipes=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM public.recipes;')
          echo "Database awake. recipes=$recipes"

          # Zero rows means reachable but empty — the wipe scenario. Surface it
          # loudly rather than reporting a cheerful green check.
          if [ "$recipes" -eq 0 ]; then
            echo "::warning::Database is reachable but contains ZERO recipes."
            echo "If that is unexpected, restore from backups/ — see Settings → Restore in the app."
          fi

      - name: Ping backend
        run: |
          set -euo pipefail
          # hearthbackend is the API. hearth-z2lo is the FRONTEND and 404s on
          # /api/* — it only appears in the backend's CORS allowlist.
          # --max-time 90 because a cold Render free instance takes ~30-50s.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://hearthbackend.onrender.com/health || echo 000)
          echo "Backend /health -> HTTP $code"
          case "$code" in
            200) echo "Backend healthy." ;;
            503) echo "::error::Backend returned 503 — the Render service is suspended or unavailable. Check the Render dashboard; pinging cannot wake a suspended service." ;;
            000) echo "::warning::Backend unreachable (timeout or DNS failure)." ;;
            *)   echo "::warning::Backend returned $code, expected 200." ;;
          esac
