name: Backup Restore Drill

# Proves the committed dump can actually be restored. An untested backup is a
# guess, not a backup. Runs against a throwaway Postgres container — it never
# connects to Supabase, so it cannot touch production data.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'   # Mondays, 7 AM UTC — an hour after the daily backup
  pull_request:
    paths:
      - 'backups/hearth_backup.sql.enc'
      - '.github/workflows/backup.yml'
      - '.github/workflows/restore-drill.yml'

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local throwaway container — not Supabase, no secret involved
      TARGET: postgresql://postgres:drill@localhost:5432/drill

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Decrypt the backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set — cannot decrypt the backup."
            exit 1
          fi
          node backend/backupCrypto.js decrypt backups/hearth_backup.sql.enc /tmp/backup.sql
          # Independently confirm the committed ciphertext matches the recorded plaintext
          if [ -f backups/hearth_backup.sha256 ]; then
            echo "$(cat backups/hearth_backup.sha256)  /tmp/backup.sql" | sha256sum -c - \
              || { echo "::error::Decrypted content does not match its recorded checksum."; exit 1; }
            echo "Checksum matches the recorded plaintext hash."
          fi

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Count rows the dump claims to contain
        run: |
          set -euo pipefail
          # The dump uses --inserts, so one INSERT statement == one row.
          # Only public.* is counted; auth.* rows land in Supabase's own schema,
          # which this throwaway container doesn't have.
          grep -oE '^INSERT INTO public\.[a-z_]+ ' /tmp/backup.sql \
            | awk '{ t=$3; sub(/^public\./,"",t); print t }' \
            | sort | uniq -c \
            | awk '{ print $2"\t"$1 }' | sort > /tmp/expected.tsv
          echo "Expected row counts:"
          column -t /tmp/expected.tsv | sed 's/^/  /'

      - name: Restore the dump
        run: |
          set -euo pipefail
          # Supabase provides an auth schema that this throwaway container has
          # no idea about. The public dump depends on it two ways:
          #   - auth.users / auth.identities, targets of the Section 2 inserts
          #   - auth.uid() / role() / email() / jwt(), called by 11 RLS policies
          # Stub both. The functions return NULL because the drill only proves
          # the dump replays — no policy is ever evaluated against a live session.
          #
          # Quoted heredoc (<<'SQL') so neither the shell nor YAML touches the
          # $fn$ dollar-quoting or anything else in the body.
          cat > /tmp/auth_stub.sql <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users      (id uuid PRIMARY KEY, email text);
          CREATE TABLE IF NOT EXISTS auth.identities (id uuid PRIMARY KEY, user_id uuid);
          CREATE OR REPLACE FUNCTION auth.uid()   RETURNS uuid  LANGUAGE sql STABLE AS $fn$ SELECT NULL::uuid  $fn$;
          CREATE OR REPLACE FUNCTION auth.role()  RETURNS text  LANGUAGE sql STABLE AS $fn$ SELECT NULL::text  $fn$;
          CREATE OR REPLACE FUNCTION auth.email() RETURNS text  LANGUAGE sql STABLE AS $fn$ SELECT NULL::text  $fn$;
          CREATE OR REPLACE FUNCTION auth.jwt()   RETURNS jsonb LANGUAGE sql STABLE AS $fn$ SELECT NULL::jsonb $fn$;
          SQL
          psql "$TARGET" --set ON_ERROR_STOP=1 -q -f /tmp/auth_stub.sql

          # ON_ERROR_STOP makes any failed statement fail the job.
          # DROP ... IF EXISTS against an empty DB emits harmless notices.
          # Column mismatches in the auth stub are expected, so the public
          # section is what must restore perfectly; auth is checked separately.
          sed '/^-- Section 2: auth identities/,$d' /tmp/backup.sql > /tmp/public_only.sql
          psql "$TARGET" \
            --set ON_ERROR_STOP=1 \
            --quiet \
            -f /tmp/public_only.sql
          echo "public schema restored without errors."

      - name: Check the auth section is present and well-formed
        run: |
          set -euo pipefail
          n=$(grep -c '^INSERT INTO auth\.users ' /tmp/backup.sql || true)
          echo "auth.users rows in backup: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::Backup contains no auth.users rows — logins would not be recoverable."
            exit 1
          fi
          # Every auth insert must be conflict-safe, or a partial restore aborts
          bad=$(grep '^INSERT INTO auth\.' /tmp/backup.sql | grep -vc 'ON CONFLICT DO NOTHING;' || true)
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad auth INSERT(s) lack ON CONFLICT DO NOTHING."
            exit 1
          fi
          echo "All auth inserts are conflict-safe."

      - name: Compare restored row counts against the dump
        run: |
          set -euo pipefail
          : > /tmp/actual.tsv
          while IFS=$'\t' read -r tbl _; do
            n=$(psql "$TARGET" -tAc "SELECT count(*) FROM public.\"$tbl\";")
            printf '%s\t%s\n' "$tbl" "$n" >> /tmp/actual.tsv
          done < /tmp/expected.tsv
          sort -o /tmp/actual.tsv /tmp/actual.tsv

          echo "table | expected | restored"
          if diff -q /tmp/expected.tsv /tmp/actual.tsv > /dev/null; then
            join -t $'\t' /tmp/expected.tsv /tmp/actual.tsv | awk -F'\t' '{print "  ✓ "$1"  "$2" = "$3}'
            echo ""
            echo "Restore verified — every table matches the dump."
          else
            echo "::error::Restored row counts do not match the dump."
            diff /tmp/expected.tsv /tmp/actual.tsv || true
            exit 1
          fi

      - name: Sanity-check the app's core data
        run: |
          set -euo pipefail
          # Guards against a dump that restores cleanly but is actually empty
          recipes=$(psql "$TARGET" -tAc 'SELECT count(*) FROM public.recipes;')
          ingredients=$(psql "$TARGET" -tAc 'SELECT count(*) FROM public.ingredients;')
          echo "recipes: $recipes | ingredients: $ingredients"
          if [ "$recipes" -eq 0 ]; then
            echo "::error::Restored database has zero recipes."
            exit 1
          fi
          echo ""
          echo "Recipes recovered from the backup:"
          psql "$TARGET" -tAc 'SELECT name FROM public.recipes ORDER BY name;' | sed 's/^/  - /'
