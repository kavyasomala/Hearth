name: Daily Database Backup

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC = 2 AM ET daily
  workflow_dispatch:        # also allows manual trigger from GitHub UI
    inputs:
      allow_data_loss:
        description: 'Commit even if recipe count dropped sharply (use after deleting recipes on purpose)'
        type: boolean
        default: false

# The commit step pushes back to the repo, which needs write access.
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check required secrets
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE:  ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=false
          [ -n "$DATABASE_URL" ]      || { echo "::error::DATABASE_URL secret is not set."; missing=true; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE secret is not set. Generate one with: openssl rand -base64 32"; missing=true; }
          [ "$missing" = false ]

      # Prints the connection's shape — host, port, user, database — never the password.
      - name: Inspect DATABASE_URL (no password shown)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          stripped="${DATABASE_URL#*://}"
          hostpart="${stripped#*@}"
          user="${stripped%%:*}"
          hostport="${hostpart%%/*}"
          host="${hostport%%:*}"
          port="${hostport##*:}"
          echo "user: $user | host: $host | port: $port"

          ok=true
          case "$host" in
            db.*.supabase.co)
              echo "::error::Direct Supabase host is IPv6-only; Actions runners are IPv4."
              echo "Use the Session Pooler URL instead."
              ok=false ;;
            *.pooler.supabase.com) echo "Host is the Supabase pooler — reachable over IPv4." ;;
            *) echo "::warning::Unrecognised host pattern; continuing." ;;
          esac
          if [ "$port" = "6543" ]; then
            echo "::error::Port 6543 is transaction mode; pg_dump needs 5432 (session mode)."
            ok=false
          fi
          if ! getent hosts "$host" > /dev/null; then
            echo "::error::Host '$host' does not resolve. Re-copy the connection string from Supabase."
            ok=false
          fi
          [ "$ok" = true ]

      # ubuntu-latest ships pg_dump 16, but Supabase runs 17, and pg_dump refuses
      # to dump a newer server. PGDG installs into a versioned directory, so
      # $GITHUB_PATH is needed to win over the preinstalled /usr/bin/pg_dump.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups build

          echo "pg_dump: $(command -v pg_dump) — $(pg_dump --version)"
          server_major=$(psql "$DATABASE_URL" -tAc 'SHOW server_version;' | cut -d. -f1)
          client_major=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          if [ "$client_major" -lt "$server_major" ]; then
            echo "::error::pg_dump $client_major is older than server $server_major — bump postgresql-client-$server_major above."
            exit 1
          fi

          # --- App data (schema + rows) ------------------------------------
          # --schema=public only. A whole-database dump also captures Supabase's
          # auth/storage schemas, and with --clean that would emit DROP SCHEMA auth
          # on restore, destroying every login. public has no FKs outside itself.
          #
          # --inserts (not COPY) so the restore endpoint can replay the file with
          # ordinary SQL; COPY ... FROM stdin needs a streaming protocol.
          pg_dump "$DATABASE_URL" \
            --schema=public \
            --no-owner --no-acl \
            --clean --if-exists \
            --inserts \
            --format=plain \
            --file=build/public.sql

          # --- Auth identities (rows only, no DDL) -------------------------
          # auth.* is managed by Supabase; we never recreate its structure, only
          # re-seed the rows so logins and password hashes survive a wipe.
          pg_dump "$DATABASE_URL" \
            --data-only \
            --no-owner --no-acl \
            --inserts \
            --table=auth.users \
            --table=auth.identities \
            --format=plain \
            --file=build/auth.sql

          # Restoring auth rows must never clobber accounts that already exist.
          sed -i 's/^INSERT INTO \(auth\.[a-z_]*\) \(.*\);$/INSERT INTO \1 \2 ON CONFLICT DO NOTHING;/' build/auth.sql

          # pg_dump 17.6+ emits \restrict / \unrestrict — psql CLIENT meta-commands.
          # The restore endpoint sends SQL straight to the server, which rejects
          # them with: syntax error at or near "\". Drop them at dump time so the
          # stored artifact is replayable by any client, psql or otherwise.
          # [\] is a bracket expression matching one literal backslash. Written
          # as \\ it does not survive the shell -> sed layers reliably, and the
          # pattern silently matches nothing instead of erroring.
          sed -i -E '/^[[:space:]]*[\](restrict|unrestrict)\b/d' build/public.sql build/auth.sql

          {
            echo "-- Hearth backup $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "-- Section 1: public schema (structure + data, destructive)"
            cat build/public.sql
            echo ""
            echo "-- Section 2: auth identities (data only, non-destructive)"
            cat build/auth.sql
          } > build/hearth_backup.sql

          # Fail loudly rather than shipping a dump the restore endpoint can't replay
          if grep -qE '^[[:space:]]*[\](restrict|unrestrict)\b' build/hearth_backup.sql; then
            echo "::error::psql meta-commands survived stripping — restore would fail."
            exit 1
          fi

          wc -c build/hearth_backup.sql

      - name: Verify dump before encrypting
        run: |
          set -euo pipefail
          F=build/hearth_backup.sql
          [ -s "$F" ] || { echo "::error::Dump is empty."; exit 1; }
          grep -q "PostgreSQL database dump complete" "$F" || { echo "::error::Dump looks truncated."; exit 1; }
          # A public-only dump must never carry Supabase-internal DDL
          if grep -qE '^(CREATE|DROP) SCHEMA (auth|storage|realtime|vault)' "$F"; then
            echo "::error::Dump contains Supabase-internal schema DDL — restoring it would break auth."
            exit 1
          fi

          # An empty database still produces a structurally valid dump, so byte
          # size proves nothing. Count actual rows.
          recipes=$(grep -c '^INSERT INTO public.recipes '     "$F" || true)
          ingredients=$(grep -c '^INSERT INTO public.ingredients ' "$F" || true)
          logins=$(grep -c '^INSERT INTO auth.users '          "$F" || true)
          echo "recipes=$recipes ingredients=$ingredients logins=$logins"

          {
            echo "RECIPES=$recipes"
            echo "INGREDIENTS=$ingredients"
            echo "LOGINS=$logins"
          } >> "$GITHUB_ENV"

      # The whole point of a backup is to survive a wipe — but a nightly job that
      # blindly commits will overwrite the last good backup with an empty one
      # within 24 hours of a data loss. Compare against the previous run and stop.
      - name: Refuse to overwrite a good backup with an empty one
        run: |
          set -euo pipefail
          META=backups/backup-meta.json
          prev_recipes=0
          if [ -f "$META" ]; then
            prev_recipes=$(node -e "
              try { console.log(JSON.parse(require('fs').readFileSync('$META','utf8')).recipes ?? 0) }
              catch { console.log(0) }")
          fi
          echo "previous backup had $prev_recipes recipes; this one has $RECIPES"

          if [ "${{ inputs.allow_data_loss }}" = "true" ]; then
            echo "::warning::allow_data_loss was set — skipping the drop check."
            exit 0
          fi

          if [ "$prev_recipes" -gt 0 ] && [ "$RECIPES" -eq 0 ]; then
            echo "::error::Database has 0 recipes but the last backup had $prev_recipes."
            echo "Refusing to commit — this would destroy your newest good backup."
            echo "If the data really is gone, restore from Settings -> Backup & Restore in the app."
            echo "If you deleted them on purpose, re-run this workflow with allow_data_loss checked."
            exit 1
          fi

          # Also catch a partial wipe: more than half the recipes vanishing
          if [ "$prev_recipes" -ge 4 ] && [ "$RECIPES" -lt $(( prev_recipes / 2 )) ]; then
            echo "::error::Recipe count fell from $prev_recipes to $RECIPES (>50% drop)."
            echo "Refusing to commit. Re-run with allow_data_loss checked if this was intentional."
            exit 1
          fi
          echo "Drop check passed."

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # This repo is public and the dump holds emails and password hashes,
          # so only the encrypted form is ever committed.
          node backend/backupCrypto.js encrypt build/hearth_backup.sql backups/hearth_backup.sql.enc

          # Prove the committed artifact is actually recoverable before it lands
          node backend/backupCrypto.js decrypt backups/hearth_backup.sql.enc build/roundtrip.sql
          cmp -s build/hearth_backup.sql build/roundtrip.sql \
            || { echo "::error::Encrypted file does not round-trip."; exit 1; }
          echo "Round-trip verified."

          # Ciphertext differs every run even when data is identical, so the
          # plaintext hash is what decides whether there's anything to commit.
          sha256sum build/hearth_backup.sql | cut -d' ' -f1 > backups/hearth_backup.sha256

          # Row counts are not sensitive, and keeping them in plaintext lets the
          # next run's drop check read them without needing the passphrase.
          node -e "
            require('fs').writeFileSync('backups/backup-meta.json', JSON.stringify({
              takenAt:     new Date().toISOString(),
              recipes:     Number(process.env.RECIPES),
              ingredients: Number(process.env.INGREDIENTS),
              logins:      Number(process.env.LOGINS),
            }, null, 2) + '\n');
          "
          cat backups/backup-meta.json
          ls -lh backups/

      - name: Commit backup
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Retire the old plaintext dump if it's still tracked
          if git ls-files --error-unmatch backups/hearth_backup.sql > /dev/null 2>&1; then
            git rm --quiet --cached backups/hearth_backup.sql
            rm -f backups/hearth_backup.sql
          fi

          git add backups/hearth_backup.sql.enc backups/hearth_backup.sha256 backups/backup-meta.json
          if git diff --cached --quiet -- backups/hearth_backup.sha256; then
            echo "Data unchanged since last backup — nothing to commit."
            exit 0
          fi

          # Counts go in the commit message so the app's version dropdown can be
          # built from one GitHub API call, with no downloading or decrypting.
          git commit -m "chore: daily DB backup $(date -u '+%Y-%m-%d') — ${RECIPES} recipes, ${INGREDIENTS} ingredients, ${LOGINS} logins [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
